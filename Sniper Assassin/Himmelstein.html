<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Yardbird — Himmelstein Range Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Spectral:ital,wght@0,300;0,500;1,300&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C141C; --panel:#152130; --panel2:#1C2B3C; --line:#2A3E52;
  --frost:#C6D6E3; --dim:#7D93A6; --glacier:#5FB7D4; --brass:#C9A227;
  --alarm:#E4572E; --amber:#E8A33D; --moss:#63A183; --violet:#9A87C4;
  --display:"Oswald","Arial Narrow","Helvetica Neue",sans-serif;
  --body:"Spectral",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%, #1B2E3F 0%, transparent 60%), var(--ink);
  color:var(--frost);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}

header.scope{border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(12,20,28,.97),rgba(12,20,28,.85));
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:40}
.scope-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.reticle{width:92px;height:92px;flex:0 0 92px;position:relative}
.reticle .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.reticle .big{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:#fff}
.reticle .small{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.16em;margin-top:2px}
.hdr-txt{flex:1 1 240px;min-width:220px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--brass);text-transform:uppercase;margin:0 0 4px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(20px,4vw,30px);letter-spacing:.06em;text-transform:uppercase;margin:0;color:#fff}
.sub{font-size:12.5px;color:var(--dim);margin:4px 0 0;font-style:italic}
.counters{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%}
.ctr{border:1px solid var(--line);border-radius:2px;padding:5px 11px;background:var(--panel);min-width:100px}
.ctr b{display:block;font-family:var(--display);font-size:18px;font-weight:500;color:#fff}
.ctr span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.ctr.assn b{color:var(--glacier)} .ctr.feat b{color:var(--brass)} .ctr.left b{color:var(--amber)}

nav.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 20px;flex-wrap:wrap}
nav.tabs button{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:500;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:14px 16px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass)}
nav.tabs button:hover{color:var(--frost)}
nav.tabs button:focus-visible,.jump button:focus-visible,.tick:focus-visible,.runbar:focus-visible,.more:focus-visible,.filters button:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}

/* run jump bar */
.jump{position:sticky;top:0;z-index:30;display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 14px;margin:0 0 18px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(12,20,28,.98),rgba(12,20,28,.9))}
.jump button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel);
  border:1px solid var(--line);color:var(--dim);padding:7px 11px;cursor:pointer;border-radius:2px}
.jump button:hover{color:var(--frost);border-color:var(--glacier)}
.jump button.full{border-color:var(--moss);color:var(--moss)}
.jump .util{margin-left:auto;display:flex;gap:6px}

.notice{border-left:3px solid var(--alarm);background:rgba(228,87,46,.07);padding:14px 16px;margin:0 0 16px;font-size:14.5px}
.notice.info{border-left-color:var(--glacier);background:rgba(95,183,212,.07)}
.notice.file{border-left-color:var(--violet);background:rgba(154,135,196,.08)}
.notice h3{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:12px;margin:0 0 6px;color:var(--alarm);font-weight:600}
.notice.info h3{color:var(--glacier)} .notice.file h3{color:var(--violet)}
.notice p{margin:0 0 8px} .notice p:last-child{margin:0}

/* RUN */
.run{border:1px solid var(--line);background:var(--panel);margin:0 0 16px;scroll-margin-top:170px}
.runbar{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px 18px;
  background:none;border:none;color:inherit;cursor:pointer;border-bottom:1px solid transparent}
.run.open .runbar{border-bottom-color:var(--line)}
.run-no{font-family:var(--display);font-size:30px;font-weight:700;color:var(--brass);line-height:.9;opacity:.85;flex:0 0 auto}
.runbar h2{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.07em;font-size:17.5px;margin:0;color:#fff}
.runbar .goal{font-size:13.5px;color:var(--dim);margin:5px 0 0;font-style:italic}
.runbar .chev{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--glacier);flex:0 0 auto;padding-top:4px}
.run-body{display:none;padding:0 0 16px}
.run.open .run-body{display:block}
.rprog{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);margin:6px 0 0}

.card{margin:16px 18px;border:1px dashed var(--line);background:var(--panel2);padding:13px 15px}
.card h4{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);margin:0 0 9px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-top:3px}
.kv dd{margin:0}

.sect{margin:20px 18px 0}
.sect > h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:11.5px;color:var(--glacier);
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);font-weight:500}

/* STEP */
.step{border:1px solid var(--line);margin:0 0 9px;background:rgba(12,20,28,.4)}
.step-top{display:flex;gap:11px;padding:11px 13px;align-items:flex-start}
.tick{flex:0 0 22px;width:22px;height:22px;margin-top:2px;border:1px solid var(--line);background:transparent;
  color:transparent;cursor:pointer;border-radius:2px;font-size:13px;line-height:1}
.tick:hover{border-color:var(--moss)}
.tick[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#0C141C}
.step-head{flex:1;background:none;border:none;color:inherit;text-align:left;cursor:pointer;padding:0;font:inherit}
.snum{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:.1em}
.step-head h5{font-family:var(--display);font-size:14.5px;letter-spacing:.05em;text-transform:uppercase;margin:1px 0 0;color:#fff;font-weight:500}
.step.done .step-head h5{color:var(--dim);text-decoration:line-through}
.step-head .chev{font-family:var(--mono);font-size:10px;color:var(--glacier);letter-spacing:.14em;margin-top:5px;display:inline-block}
.badges{margin:8px 0 0;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:2px;border:1px solid;display:inline-block}
.badge.assn{color:var(--glacier);border-color:rgba(95,183,212,.5);background:rgba(95,183,212,.09)}
.badge.feat{color:var(--brass);border-color:rgba(201,162,39,.5);background:rgba(201,162,39,.09)}
.badge.warn{color:var(--alarm);border-color:rgba(228,87,46,.55);background:rgba(228,87,46,.1);font-weight:600}
.badge.time{color:var(--amber);border-color:rgba(232,163,61,.55);background:rgba(232,163,61,.1)}
.badge.unv{color:var(--violet);border-color:rgba(154,135,196,.55);background:rgba(154,135,196,.1)}
.detail{display:none;padding:2px 13px 14px 46px;border-top:1px dashed var(--line);margin-top:2px}
.step.open .detail{display:block}
.f{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;font-size:14px;margin:10px 0 0}
.f dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);padding-top:4px}
.f dd{margin:0}
.f dd.none{color:var(--dim);font-style:italic}
.f ul{margin:0;padding-left:16px} .f li{margin:0 0 3px}
.wbox{border-left:3px solid var(--alarm);background:rgba(228,87,46,.07);padding:8px 11px;margin:11px 0 0;font-size:13.5px}
.ubox{border-left:3px solid var(--violet);background:rgba(154,135,196,.07);padding:8px 11px;margin:9px 0 0;font-size:13.5px}
.tbox{border-left:3px solid var(--amber);background:rgba(232,163,61,.07);padding:8px 11px;margin:9px 0 0;font-size:13.5px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.filters button{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--panel);
  border:1px solid var(--line);color:var(--dim);padding:7px 12px;cursor:pointer;border-radius:2px}
.filters button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:rgba(201,162,39,.09)}
.filters button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);margin:0 0 6px;background:var(--panel);align-items:flex-start}
.row.done{opacity:.55} .row.done .rname{text-decoration:line-through}
.rmain{flex:1}
.rname{font-family:var(--display);font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff;font-weight:500}
.rcond{font-size:14px;margin:2px 0 0}
.rmeta{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;margin:5px 0 0}
.rnote{font-size:13px;color:var(--violet);margin:5px 0 0}

.vtable{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 20px}
.vtable th,.vtable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.vtable th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);background:var(--panel2)}
h3.blk{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:#fff;margin:26px 0 10px;font-weight:500}
.src{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.7}
a{color:var(--glacier)}
@media (max-width:640px){
  .kv,.f{grid-template-columns:1fr;gap:1px 0}
  .kv dt,.f dt{padding-top:8px}
  .card,.sect{margin-left:11px;margin-right:11px}
  .detail{padding-left:14px}
  .jump{top:0}
  .run{scroll-margin-top:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="scope">
  <div class="scope-in">
    <div class="reticle">
      <svg viewBox="0 0 92 92" width="92" height="92" aria-hidden="true">
        <circle cx="46" cy="46" r="39" fill="none" stroke="#2A3E52" stroke-width="6"/>
        <circle id="ring" cx="46" cy="46" r="39" fill="none" stroke="#C9A227" stroke-width="6"
                stroke-dasharray="245" stroke-dashoffset="245" transform="rotate(-90 46 46)"/>
        <line x1="46" y1="2" x2="46" y2="12" stroke="#5FB7D4" stroke-width="1"/>
        <line x1="46" y1="80" x2="46" y2="90" stroke="#5FB7D4" stroke-width="1"/>
        <line x1="2" y1="46" x2="12" y2="46" stroke="#5FB7D4" stroke-width="1"/>
        <line x1="80" y1="46" x2="90" y2="46" stroke="#5FB7D4" stroke-width="1"/>
      </svg>
      <div class="center"><span class="big" id="ringN">0</span><span class="small">of 28</span></div>
    </div>
    <div class="hdr-txt">
      <p class="eyebrow">Sniper Assassin · Himmelstein, Austria</p>
      <h1>The Last Yardbird</h1>
      <p class="sub">Step-by-step challenge route — Hitman World of Assassination</p>
    </div>
    <div class="counters">
      <div class="ctr assn"><b id="cA">0/14</b><span>Assassination</span></div>
      <div class="ctr feat"><b id="cF">0/14</b><span>Feats</span></div>
      <div class="ctr"><b id="cD">0/0</b><span>Discovery</span></div>
      <div class="ctr left"><b id="cL">28</b><span>Remaining</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-runs" aria-selected="true">Runs</button>
    <button role="tab" id="t-list" aria-selected="false">Checklist</button>
    <button role="tab" id="t-ver" aria-selected="false">Verification log</button>
  </nav>
  <section id="p-runs" role="tabpanel" aria-labelledby="t-runs"></section>
  <section id="p-list" role="tabpanel" aria-labelledby="t-list" hidden></section>
  <section id="p-ver" role="tabpanel" aria-labelledby="t-ver" hidden></section>
</div>

<script>
/* ═══════════════ CHALLENGE DATA ═══════════════
   Names + conditions for 27 taken verbatim from the uploaded in-game
   challenge file. Faster Than Rocco added from web sources and flagged.
   ═══════════════════════════════════════════════ */
const CH = [
 {id:"elab",  n:"An Elabyrinth Plot", t:"a", c:"Eliminate Dorian Lang and Doris Lee with the statue in the maze.", m:"×1.10", run:5, f:1},
 {id:"smoke", n:"Smokestack Lightnin'", t:"a", c:"Eliminate three targets by electrocution within thirty seconds.", m:"×1.10", run:4, f:1},
 {id:"swtf",  n:"Sleeping with the Fishes", t:"a", c:"Eliminate and hide five targets in water.", m:"×1.08", run:6, f:1},
 {id:"body",  n:"Bodysnatcher", t:"a", c:"Eliminate all of the bodyguards.", m:"×1.05", run:1, f:1, note:"15 bodyguards. Confirmed by the HUD counter, gamepressure and Shacknews."},
 {id:"clean", n:"Clean Slate", t:"a", c:"Eliminate and hide all targets.", m:"×1.10", run:6, f:1, note:"Wiki challenge page: all three principals plus every bodyguard, bodies concealed."},
 {id:"loose", n:"No Loose Ends", t:"a", c:"Eliminate all bodyguards after starting the evacuation.", m:"×1.10", run:7, f:1},
 {id:"killer",n:"Killer Shot", t:"a", c:"Eliminate Dorian Lang and Guillaume Maison with the loudspeaker outside the art gallery.", m:"×1.09", run:4, f:1},
 {id:"ahotc", n:"A Head Off the Curve", t:"a", c:"Eliminate all targets with headshots.", m:"×1.12", run:6, f:1, v:"partial",
  note:"Your file says \u201call targets\u201d. Shacknews says only the three principals. Unresolved \u2014 plan for all 18 and it satisfies both readings."},
 {id:"heavy", n:"Heavy Burden", t:"a", c:"Eliminate the three main targets with the same suspended object.", m:"×1.10", run:1, f:1},
 {id:"touch", n:"Touch and Go", t:"a", c:"Eliminate the three main targets while they are escaping.", m:"×1.08", run:7, f:1},
 {id:"light", n:"Got a Light?", t:"a", c:"Eliminate the three main targets in the same explosion.", m:"×1.14", run:3, f:1},
 {id:"boom",  n:"Boom Boom", t:"a", c:"Eliminate five targets in explosions within thirty seconds.", m:"×1.09", run:3, f:1},
 {id:"waltz", n:"A Waltz with Death", t:"a", c:"Eliminate seven targets during the bridal waltz.", m:"×1.09", run:2, f:1},
 {id:"rocco", n:"Faster Than Rocco", t:"a", c:"Complete The Last Yardbird in 1 minute 47 seconds or less.", m:"none", run:8, f:0, v:"conflict",
  note:"NOT PRESENT in your uploaded challenge file. Added to World of Assassination in the October 2023 roadmap; reward is The Sniper Challenge Suit. Confirmed by four web sources. Check your in-game list \u2014 if it shows 28, your file is stale; if it shows 27, ignore this row."},

 {id:"gnome", n:"Agnomaly", t:"f", c:"Shoot the six garden gnomes hidden around the mansion and its grounds.", m:"×1.07", run:1, f:1, v:"partial",
  note:"Condition redacted in your file; wording reconstructed from the Hitman Wiki challenge page. Gnomes reveal sequentially."},
 {id:"black", n:"Blackout", t:"f", c:"Turn off the lights in all rooms of the mansion.", m:"×1.06", run:1, f:1, v:"partial",
  note:"Switch count is single-sourced (gameplay.tips says 18). A separate Steam guide maps it as nine building blocks instead. Do not stop at 18 if it has not popped."},
 {id:"kiln",  n:"Kiln Time", t:"f", c:"Destroy all 47 potted plants around the map.", m:"×1.06", run:1, f:1,
  note:"Condition redacted in your file; the count 47 is confirmed by four web sources."},
 {id:"prom",  n:"Prometheus", t:"f", c:"Shoot the campfire in the cave below the helipad.", m:"×1.04", run:1, f:1, note:"Condition redacted in your file; reconstructed from three web sources."},
 {id:"climb", n:"The Higher You Climb", t:"f", c:"Shoot the base jumper's bottle, then kill him once he starts his jump.", m:"×1.08", run:1, f:1, note:"Condition redacted in your file; reconstructed from three web sources."},
 {id:"hike",  n:"Take a Hike", t:"f", c:"Shoot the fence sign so the hiker can pass.", m:"×1.04", run:1, f:1, note:"Condition redacted in your file; reconstructed from three web sources."},
 {id:"rats",  n:"Are You Pondering What I'm Pondering?", t:"f", c:"Shoot the two rodents in the kitchen.", m:"×1.04", run:1, f:1, note:"Condition redacted in your file. Wiki says rats, other guides say mice \u2014 same pair."},
 {id:"art",   n:"Art Critic", t:"f", c:"Shoot the second-floor painting, wait for it to be re-hung, then shoot it again.", m:"×1.05", run:1, f:1, v:"partial",
  note:"Condition redacted in your file. Wiki says an art critic re-hangs it; three other guides say the butler."},
 {id:"daisy", n:"Psycho Daisies", t:"f", c:"Shoot the bridal bouquet.", m:"×1.04", run:2, f:1},
 {id:"faith", n:"Faithless", t:"f", c:"Shoot the priest's wine glass before the bride reaches the altar.", m:"×1.04", run:2, f:1, note:"Condition redacted in your file; reconstructed from three web sources."},
 {id:"pigeon",n:"How Do You Due?", t:"f", c:"Shoot the ten pigeons hidden around the map.", m:"×1.07", run:1, f:1, v:"partial",
  note:"Condition redacted in your file. The mirrored location list contains only nine; the tenth comes from Steam guide comments."},
 {id:"duck",  n:"Quacker than the Eye", t:"f", c:"Shoot the ten rubber ducks hidden around the map.", m:"×1.07", run:1, f:1, note:"Condition redacted in your file; ten locations recovered from two web guides."},
 {id:"rice",  n:"And He Shall Rice", t:"f", c:"Shoot the sack of rice on the roof.", m:"×1.04", run:1, f:1, note:"Condition redacted in your file; reconstructed from three web sources."},
 {id:"hawk",  n:"Hawkeye", t:"f", c:"Shoot all of the hawks.", m:"×1.06", run:1, f:1, note:"Three hawks, per two web sources."}
];
const byId = Object.fromEntries(CH.map(c=>[c.id,c]));

const RANGE = {
  nest:"One fixed hillside nest west of the estate. Sniper Assassin has no selectable starting locations and 47 never moves \u2014 every step below is a shot taken from the same spot.",
  disg:"None. Your uploaded file reports disguiseCount 0 and an empty disguise array; the wiki states outright that this mission has no disguises. No step in this guide requires one.",
  item:"Sieger 300 Ghost only, fixed. 18 rounds (6 loaded + 12 spare). No gadgets, no pickups, no smuggled weapons \u2014 the file also reports areaCount 0, so there are no items to collect anywhere on the map.",
  ammo:"Body-Piercing (unlimited) \u00b7 Wall-Piercing (limited, shoots through walls) \u00b7 Shockwave (limited, knocks bodies over railings and into the chasm).",
  mast:"Himmelstein mastery 1\u201320 unlocks Sieger 300 Ghost upgrades only \u2014 accuracy, reload speed, magazine size; Flared Magwell IV at Level 20. They apply inside this mission only.",
  mode:"Solo. Hold fire to stabilise the scope and trigger the short slow-motion window."
};

/* ═══════════════ RUNS ═══════════════ */
const RUNS = [
{no:1, title:"Feats sweep + the chandelier", tag:"Feats \u00b7 Heavy Burden",
 goal:"Bank thirteen of the fourteen Feats plus the chandelier assassination and all fifteen bodyguards, by doing the time-gated Feats early and everything else after the clock stops.",
 sections:[
 {h:"Phase 1 \u2014 time-gated Feats, first few minutes", steps:[
  {t:"Shoot the fence sign for the hiker",
   where:"The mountain path directly ahead of your nest \u2014 the fence with the posted sign is the first man-made object on the trail.",
   npc:"A tourist/hiker walking that path. He must already be beside the fence.",
   act:"Shoot the sign so he can pass.",
   warn:"Firing at an empty fence does nothing. If you miss the window he walks a route, so wait for him to come back round rather than restarting.",
   ch:["hike"]},
  {t:"Break the jumper's bottle, then kill him mid-air",
   where:"The summit of the mountain above the estate.",
   npc:"A base jumper standing next to a bottle.",
   act:"Shoot the bottle first. He reacts, steps to the edge and looks down. Once he has committed to the jump, kill him in mid-air.",
   warn:"Strict order. Killing him before the bottle breaks awards nothing and there is only one jumper on the map. A hit before he leaves the ledge does not count.",
   ch:["climb"], W:1},
  {t:"Shoot the painting twice",
   where:"Second floor of the chateau, the room on the left/west side \u2014 the same art gallery room used for Killer Shot in Run 4.",
   npc:"An NPC comes to straighten it. The wiki calls him an art critic; three other guides call him the butler.",
   act:"Shoot the large painting, wait for it to be re-hung, then shoot it a second time.",
   unv:"No source states whether shooting inside the mansion this early disturbs Guillaume Maison's routine. If your chandelier meeting later fails to form, move this step to Run 4 or Run 5.",
   ch:["art"], U:1},
  {t:"Destroy the rice sack on the roof",
   where:"Right-hand roof of the mansion, on the cornice beside the stacked cages and sacks.",

/* ═══════════════ STATE ═══════════════ */
let done={}, steps={}, openRun={}, openStep={};
const KEY="yardbird-v2";
function reportProgress(){try{const r=JSON.parse(localStorage.getItem('hitman-progress-registry')||'{}');r['m14']={done:CH.filter(c=>done[c.id]).length,total:CH.length,updated:Date.now()};localStorage.setItem('hitman-progress-registry',JSON.stringify(r));}catch(e){}}
async function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);done=o.done||{};steps=o.steps||{};}}catch(e){}}
async function persist(){try{localStorage.setItem(KEY,JSON.stringify({done,steps}));}catch(e){}reportProgress();}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function stats(){
  const a=CH.filter(c=>c.t==="a"),f=CH.filter(c=>c.t==="f");
  const da=a.filter(c=>done[c.id]).length,df=f.filter(c=>done[c.id]).length,tot=da+df;
  document.getElementById("cA").textContent=da+"/"+a.length;
  document.getElementById("cF").textContent=df+"/"+f.length;
  document.getElementById("cL").textContent=CH.length-tot;
  document.getElementById("ringN").textContent=tot;
  const C=2*Math.PI*39;
  document.getElementById("ring").style.strokeDashoffset=C-(tot/CH.length)*C;
}
function runProgress(no){
  const ids=CH.filter(c=>c.run===no);
  return [ids.filter(c=>done[c.id]).length, ids.length];
}

function badges(st){
  let h="";
  (st.ch||[]).forEach(id=>{const c=byId[id];if(c)h+=`<span class="badge ${c.t==="a"?"assn":"feat"}">${esc(c.n)}</span>`;});
  if(st.W)h+=`<span class="badge warn">! Ordering rule</span>`;
  if(st.T)h+=`<span class="badge time">\u25c6 Timing / restart</span>`;
  if(st.U)h+=`<span class="badge unv">? Unverified</span>`;
  return h?`<div class="badges">${h}</div>`:"";
}
function fields(st){
  let h=`<dl class="f">`;
  h+=`<dt>Where</dt><dd>${esc(st.where||"\u2014")}</dd>`;
  h+=`<dt>Disguise</dt><dd class="none">None \u2014 this mission has no disguises.</dd>`;
  h+=`<dt>Item</dt><dd>${esc(st.item||"Sieger 300 Ghost (fixed). No other items exist in this mission.")}</dd>`;
  h+=`<dt>NPC</dt><dd${st.npc?"":' class="none"'}>${esc(st.npc||"None involved in this step.")}</dd>`;
  h+=`<dt>Action</dt><dd>${esc(st.act||"\u2014")}</dd>`;
  h+=`</dl>`;
  if(st.warn)h+=`<div class="wbox"><b>Warning \u2014 </b>${esc(st.warn)}</div>`;
  if(st.time)h+=`<div class="tbox"><b>Timing \u2014 </b>${esc(st.time)}</div>`;
  if(st.unv)h+=`<div class="ubox"><b>Note \u2014 </b>${esc(st.unv)}</div>`;
  return h;
}

function renderRuns(){
  let h=`<div class="jump" id="jump"></div>
  <div class="notice file"><h3>Reconciled against your uploaded file</h3>
    <p>Your file confirms <b>disguiseCount 0, areaCount 0, empty disguise and area arrays</b>. That settles it: no disguises, no map areas, no Discovery challenges, no items to collect. Every step below therefore lists Disguise as none and Item as the fixed rifle \u2014 that is the mission, not an omission.</p>
    <p>Your file lists <b>27 challenges</b> (13 Assassination, 14 Feats). Web sources confirm a 28th, <b>Faster Than Rocco</b>, added in October 2023. It is tracked here and flagged; check your in-game list to see which count is current for you.</p>
    <p>Fourteen of your Feat descriptions came through as <b>[REDACTED]</b>. Those conditions were reconstructed from web sources and each one is marked in the checklist.</p>
  </div>
  <div class="notice"><h3>Two things that shape the whole route</h3>
    <p><b>No manual saves.</b> Sniper Assassin cannot save mid-mission, so nothing can be split off partway. Every amber marker is a restart decision, not a save point.</p>
    <p><b>Eight incompatible end-states for the three principals</b> \u2014 chandelier, cannon, loudspeaker, maze statue, fleeing, hidden bodies, waltz-timed, and a 1:47 sprint. Each destroys the setup for the others, which is why the route needs eight runs. Runs 1, 6 and 7 absorb everything stackable so the rest stay short.</p>
  </div>`;

  RUNS.forEach(r=>{
    const [dn,tt]=runProgress(r.no);
    const open=openRun[r.no];
    h+=`<article class="run ${open?"open":""}" id="run${r.no}">
      <button class="runbar" data-run="${r.no}" aria-expanded="${!!open}">
        <span class="run-no">${r.no}</span>
        <span style="flex:1">
          <h2>${esc(r.title)}</h2>
          <p class="goal">${esc(r.goal)}</p>
          <p class="rprog">${dn}/${tt} challenges banked \u00b7 ${esc(r.tag)}</p>
        </span>
        <span class="chev">${open?"Collapse \u25b4":"Expand \u25be"}</span>
      </button>
      <div class="run-body">
        <div class="card"><h4>Range card \u2014 identical for every run</h4><dl class="kv">
          <dt>Nest</dt><dd>${esc(RANGE.nest)}</dd>
          <dt>Disguise</dt><dd>${esc(RANGE.disg)}</dd>
          <dt>Items</dt><dd>${esc(RANGE.item)}</dd>
          <dt>Ammo</dt><dd>${esc(RANGE.ammo)}</dd>
          <dt>Mastery</dt><dd>${esc(RANGE.mast)}</dd>
          <dt>Mode</dt><dd>${esc(RANGE.mode)}</dd>
        </dl></div>`;

    let n=0;
    r.sections.forEach((sec,si)=>{
      h+=`<div class="sect"><h3>${esc(sec.h)}</h3>`;
      sec.steps.forEach((st,ix)=>{
        n++;
        const k=`${r.no}-${si}-${ix}`, on=!!steps[k], op=!!openStep[k];
        h+=`<div class="step ${on?"done":""} ${op?"open":""}" id="s-${k}">
          <div class="step-top">
            <button class="tick" aria-pressed="${on}" data-step="${k}" aria-label="Mark step done">\u2713</button>
            <button class="step-head" data-open="${k}" aria-expanded="${op}">
              <span class="snum">STEP ${n}</span>
              <h5>${esc(st.t)}</h5>
              ${badges(st)}
              <span class="chev">${op?"Hide detail \u25b4":"Show detail \u25be"}</span>
            </button>
          </div>
          <div class="detail">${fields(st)}</div>
        </div>`;
      });
      h+=`</div>`;
    });
    h+=`</div></article>`;
  });
  document.getElementById("p-runs").innerHTML=h;
  renderJump();
}

function renderJump(){
  let h="";
  RUNS.forEach(r=>{
    const [d,t]=runProgress(r.no);
    h+=`<button data-goto="${r.no}" class="${t&&d===t?"full":""}">Run ${r.no} · ${esc(r.tag.split(" · ")[0])} <span style="opacity:.6">${d}/${t}</span></button>`;
  });
  h+=`<span class="util"><button data-all="1">Expand all</button><button data-all="0">Collapse all</button></span>`;
  document.getElementById("jump").innerHTML=h;
}

document.addEventListener("click",e=>{
  const tab=e.target.closest('nav.tabs button');
  if(tab){
    document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute("aria-selected",b===tab));
    ["runs","list","ver"].forEach(k=>document.getElementById("p-"+k).hidden=(tab.id!=="t-"+k));
    return;
  }
  const go=e.target.closest("[data-goto]");
  if(go){const n=+go.dataset.goto;openRun[n]=true;renderRuns();document.getElementById("run"+n).scrollIntoView({behavior:"smooth",block:"start"});return;}
  const all=e.target.closest("[data-all]");
  if(all){const v=all.dataset.all==="1";RUNS.forEach(r=>openRun[r.no]=v);renderRuns();return;}
  const rb=e.target.closest("[data-run]");
  if(rb){const n=+rb.dataset.run;openRun[n]=!openRun[n];renderRuns();return;}
  const op=e.target.closest("[data-open]");
  if(op){const k=op.dataset.open;openStep[k]=!openStep[k];
    const el=document.getElementById("s-"+k);el.classList.toggle("open",openStep[k]);
    op.setAttribute("aria-expanded",!!openStep[k]);
    op.querySelector(".chev").textContent=openStep[k]?"Hide detail \u25b4":"Show detail \u25be";return;}
  const st=e.target.closest("[data-step]");
  if(st){const k=st.dataset.step;steps[k]=!steps[k];st.setAttribute("aria-pressed",!!steps[k]);
    document.getElementById("s-"+k).classList.toggle("done",!!steps[k]);persist();return;}
  const ct=e.target.closest("[data-ch]");
  if(ct){done[ct.dataset.ch]=!done[ct.dataset.ch];stats();renderList();renderJump();persist();return;}
  const fb=e.target.closest("[data-f]");
  if(fb){filter=fb.dataset.f;renderList();}
});

<!-- step-progress-bridge -->
<script>
/* Reports route-step ticks into 'hitman-progress-registry' so the index can
   show them beside the challenge counts. Counts what is on screen rather than
   any guide-specific state, so one implementation serves every guide. */
(function(){
  var RID="m14", SEL=".step";
  function isDone(s){
    var c=s.classList;
    if(c.contains('done')||c.contains('dn')) return true;
    if(s.getAttribute('data-done')==='1'||s.getAttribute('aria-pressed')==='true') return true;
    return !!s.querySelector('.done,.dn,[data-done="1"],[aria-pressed="true"]');
  }
  function tally(){
    var steps=document.querySelectorAll(SEL);
    if(!steps.length) return null;
    var n=0;
    for(var i=0;i<steps.length;i++) if(isDone(steps[i])) n++;
    return {steps:n,stepTotal:steps.length};
  }
  function push(){
    var t;
    try{ t=tally(); }catch(err){ return; }
    if(!t||!t.stepTotal) return;
    try{
      var r=JSON.parse(localStorage.getItem('hitman-progress-registry')||'{}');
      var e=r[RID]||(r[RID]={});
      /* the guide's own reportProgress() rewrites this entry wholesale, so
         re-add the step counts whenever they go missing or stale */
      if(e.steps===t.steps&&e.stepTotal===t.stepTotal) return;
      e.steps=t.steps; e.stepTotal=t.stepTotal; e.updated=Date.now();
      localStorage.setItem('hitman-progress-registry',JSON.stringify(r));
    }catch(err){}
  }
  var pending=false;
  function schedule(){
    if(pending) return; pending=true;
    setTimeout(function(){pending=false;push();},120);
  }
  try{
    new MutationObserver(schedule).observe(document.body,
      {subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-pressed','data-done']});
  }catch(err){}
  window.addEventListener('load',schedule);
  setTimeout(push,600);
})();
</script>
<!-- /step-progress-bridge -->
